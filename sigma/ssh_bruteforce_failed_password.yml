title: SSH Brute Force - Many Failed Passwords From One Source
id: 7c1d3a2e-5b1f-4c7e-9a10-1a2b3c4d5e01
status: experimental
description: Detects >=10 sshd "Failed password" events from one source IP within 5 minutes (reused from hustlerx01 SSH-Log-Alert idea).
author: Ansar Shaikh (hustlerx01)
date: 2026-10-11
tags: [attack.credential_access, attack.t1110.001]
logsource: {product: linux, service: sshd}
detection:
  selection:
    - 'Failed password for'
  condition: selection | count() by src_ip > 10
  timeframe: 5m
falsepositives: [Authorised vulnerability scanners, automation with rotated keys]
level: medium
