services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    profiles: ["llm"]          # docker compose --profile llm up
  triage:
    build: .
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    volumes: ["./results:/app/results"]
volumes:
  ollama: {}
